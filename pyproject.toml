[project]
name = "dinbrief"
version = "0.5.2"
authors = [{ name = "Michael P. Jung", email = "michael.jung@terreon.de" }]
license = "BSD-2-Clause OR MIT OR Apache-2.0"
license-files = ["LICENSE-*"]
readme = "README.md"
description = "PDF renderer for DIN 5008 and DIN 676 compliant letters and invoices"
keywords = ["dinbrief", "DIN", "5008", "676", "brief", "letter", "invoice", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "reportlab>=4.0.4,<6",
    "qrcode>=8.2,<9",
]

[project.urls]
Homepage = "https://github.com/bikeshedder/dinbrief"
Repository = "https://github.com/bikeshedder/dinbrief"

[dependency-groups]
dev = [
    "django>=5.2.17",
    "mypy>=2.3.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-qrcode>=8.2.0.20260518",
    "types-reportlab>=5.0.0.20260911",
    "typing-extensions>=4.16.0",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ty.analysis]
# Django is an optional dependency (see dinbrief/optional_django.py)
allowed-unresolved-imports = ["django.**"]

[tool.mypy]
files = ["dinbrief", "tests", "examples"]
strict = true

[[tool.mypy.overrides]]
# Django is an optional dependency (see dinbrief/optional_django.py)
module = ["django.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["dinbrief", "tests", "examples"]
reportUnnecessaryTypeIgnoreComment = "error"
